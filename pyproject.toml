[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "thief-agent"
dynamic = ["version"]
description = "Read local novels in a Codex-style terminal while Codex works"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["tornado>=6.1,<7", "wcwidth>=0.2", "tomli>=2; python_version < '3.11'"]
keywords = ["codex", "cli", "terminal", "reader", "tmux"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console :: Curses",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS :: MacOS X",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Utilities",
]

[project.urls]
Homepage = "https://github.com/pishiwan/thief_codex_cli"
Repository = "https://github.com/pishiwan/thief_codex_cli"
Issues = "https://github.com/pishiwan/thief_codex_cli/issues"

[project.scripts]
thief-agent = "thief_agent.cli:main"

[tool.setuptools.dynamic]
version = {attr = "thief_agent.__version__"}

[tool.setuptools.packages.find]
include = ["thief_agent*"]

[tool.setuptools.package-data]
thief_agent = ["default_config.toml"]

[tool.ruff]
line-length = 100
target-version = "py310"
